<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="popup-container">
      <div class="popup-card">
        <header class="popup-header">
          <div class="popup-header-top">
            <div class="extension-brand">
              <img class="extension-logo" src="/assets/icons/brand/logo-128.png" alt="brand logo">
              <div class="extension-brand-info">
                <h1 class="extension-name">FocusTube</h1>
                <p class="extension-description">Distraction Free YouTube</p>
              </div>
            </div>
            <div class="extension-toggle">
              <button type="button" class="extension-toggle-btn" aria-label="Toggle focus mode">
                <img src="/assets/icons/controls/power.svg" alt="">
              </button>
            </div>
          </div>
          
        </header>

        <main class="popup-main">

          <section class="settings-section">

            <div class="section-header">

              <div class="section-icon">
                <img src="/assets/icons/sections/general.svg" alt="">
              </div>

              <div class="section-heading">
                <h2>General</h2>
                <p>Manage general content on YouTube.</p>
              </div>

            </div>


            <ul class="feature-list">

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/home-feed.svg" alt="">

                    <span>Hide Home Feed</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideHomeFeed"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/shorts.svg" alt="">

                    <span>Hide Shorts</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideShorts"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/mixes.svg" alt="">

                    <span>Hide Mixes</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideMix"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/search.svg" alt="">

                    <span>Hide Search Suggestions</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideSearchSuggestions"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/scroll.svg" alt="">

                    <span>Disable Infinite Scrolling</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="disableInfiniteScrolling"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

            </ul>

          </section>

          <section class="settings-section">

            <div class="section-header">

              <div class="section-icon">
                <img src="/assets/icons/sections/watch-page.svg" alt="">
              </div>

              <div class="section-heading">
                <h2>Watch Page</h2>
                <p>Customize the watch page experience.</p>
              </div>

            </div>


            <ul class="feature-list">

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/sidebar.svg" alt="">

                    <span>Hide Video Sidebar</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideRecommendations"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/comments.svg" alt="">

                    <span>Hide Comments</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideComments"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/end-screens.svg" alt="">

                    <span>Hide End Screens</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideEndScreens"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/playlist.svg" alt="">

                    <span>Hide Playlist Panel</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hidePlaylist"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/live-chat.svg" alt="">

                    <span>Hide Live Chat</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideLiveChat"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

            </ul>

          </section>

          <section class="settings-section">

            <div class="section-header">

              <div class="section-icon">
                <img src="/assets/icons/sections/navigation.svg" alt="">
              </div>

              <div class="section-heading">
                <h2>Navigation</h2>
                <p>Configure YouTube Navigation Elements.</p>
              </div>

            </div>


            <ul class="feature-list">

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/notifications.svg" alt="">

                    <span>Hide Notifications</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideNotificationsBtn"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/explore.svg" alt="">

                    <span>Hide Explore</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideExplore"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/subscriptions.svg" alt="">

                    <span>Hide Subscriptions</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideSubscriptions"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

            </ul>

          </section>

          <section class="settings-section">

            <div class="section-header">

              <div class="section-icon">
                <img src="/assets/icons/sections/sections.svg" alt="">
              </div>

              <div class="section-heading">
                <h2>Sections</h2>
                <p>Adjust visibility of YouTube sections.</p>
              </div>

            </div>


            <ul class="feature-list">

              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/playables.svg" alt="">

                    <span>Hide YouTube Playables</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hidePlayables"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>


              <li>
                <label class="feature-item">

                  <span class="feature-info">
                    <img src="/assets/icons/features/more-from-yt.svg" alt="">

                    <span>Hide More from YouTube</span>
                  </span>

                  <span class="toggle">
                    <input
                      type="checkbox"
                      class="feature-toggle"
                      data-setting="hideMoreFromYouTube"
                    />
                    <span class="toggle-slider"></span>
                  </span>

                </label>
              </li>

            </ul>

          </section>

        </main>

        <footer class="popup-footer">
          <span class="version">v1.0.0</span>
          <div class="support-container">
            <span class="support-text">Support</span>
            <img class="support-icon" src="/assets/icons/footer/support-arrow.svg" alt="">
          </div>
        </footer>

      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
