<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="popup-container">
      <div class="popup-card">
        <header class="popup-header">
          <div class="popup-header-top">
            <div class="extension-brand">
              <img class="extension-logo" src="/assets/icons/brand/logo-128.png" alt="brand logo">
              <div class="extension-brand-info">
                <h1 class="extension-name">FocusTube</h1>
                <p class="extension-description">Distraction Free YouTube</p>
              </div>
            </div>
            <div class="extension-toggle">
              <button class="extension-toggle-btn">
                <img src="/assets/icons/controls/power.svg" alt="power icon">
              </button>
            </div>
          </div>
          <div class="popup-navigation"></div>
        </header>

        <main class="popup-main">
          <ul class="feature-list">
            <li>
              <label class="feature-item">
                <span>Hide Home Feed</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideHomeFeed"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Shorts</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideShorts"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Comments</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideComments"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Recommendations</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideRecommendations"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Live Chat</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideLiveChat"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Playlist</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hidePlaylist"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide End-Screen Feed</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideEndScreenFeed"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide End-Screen Cards</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideEndScreenCards"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Mix</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideMix"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Notifications</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideNotificationsBtn"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Explore</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideExplore"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide More From YouTube</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideMoreFromYouTube"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Subscriptions</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideSubscriptions"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Playables</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hidePlayables"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Hide Search Suggestions</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="hideSearchSuggestions"
                />
              </label>
            </li>

            <li>
              <label class="feature-item">
                <span>Disable Infinite Scrolling</span>
                <input
                  type="checkbox"
                  class="feature-toggle"
                  data-setting="disableInfiniteScrolling"
                />
              </label>
            </li>

          </ul>

          <button class="reset-button">Reset to Default</button>
        </main>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
